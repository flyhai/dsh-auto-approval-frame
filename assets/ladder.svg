<svg xmlns="http://www.w3.org/2000/svg" width="900" height="748" viewBox="0 0 900 748" role="img" aria-label="拦截梯示意：L0 下界 → L1 规则 → L2 快判 → L3 深评 → L4 人工，任一层的允许直接到执行，拒绝直接停，执行后走 L5 脱敏">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-pass" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="747" rx="14" fill="#ffffff" stroke="#e5e7eb"/>

  <rect x="36" y="56" width="828" height="676" rx="16" fill="none" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="7 6"/>
  <text x="56" y="88" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="13" font-weight="600" fill="#475569">审计</text>
  <text x="56" y="106" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#94a3b8">包住整条链</text>
  <text x="56" y="690" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#94a3b8">每层每个事件</text>
  <text x="56" y="706" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#94a3b8">都写一行</text>
  <text x="56" y="722" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="11" fill="#94a3b8">不可写即转人工</text>
  <rect x="375" y="16" width="150" height="34" rx="17" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="450" y="38" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="13" font-weight="600" fill="#334155">一次工具调用</text>
  <line x1="450" y1="50" x2="450" y2="70" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- L0 -->
  <rect x="280" y="74" width="340" height="64" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="280" y="74" width="4" height="64" rx="2" fill="#64748b"/>
  <text x="300" y="99" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="14.5" font-weight="600" fill="#0f172a">L0　下界</text>
  <text x="300" y="121" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="11.5" fill="#475569">facts → grant：never / confirm / auto</text>

  <!-- L1 -->
  <rect x="280" y="166" width="340" height="88" rx="10" fill="#ffffff" stroke="#c7d2fe"/>
  <rect x="280" y="166" width="4" height="88" rx="2" fill="#4f46e5"/>
  <text x="300" y="192" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="14.5" font-weight="600" fill="#0f172a">L1　规则</text>
  <text x="300" y="215" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="11.5" fill="#475569">五张有序表，表内按行序，表间取最严</text>
  <text x="300" y="237" font-family="ui-monospace,'Cascadia Mono',Consolas,monospace" font-size="10.8" fill="#6366f1">tool → command → file → network → sensitive</text>

  <!-- L2 -->
  <rect x="280" y="282" width="340" height="62" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="280" y="282" width="4" height="62" rx="2" fill="#0284c7"/>
  <text x="300" y="308" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="14.5" font-weight="600" fill="#0f172a">L2　快判</text>
  <text x="300" y="330" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="11.5" fill="#475569">单段写/删 × grant=auto ⇒ allow，否则升级</text>

  <!-- L3 -->
  <rect x="280" y="374" width="340" height="62" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="280" y="374" width="4" height="62" rx="2" fill="#0284c7"/>
  <text x="300" y="400" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="14.5" font-weight="600" fill="#0f172a">L3　深评</text>
  <text x="300" y="422" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="11.5" fill="#475569">一次模型调用 ⇒ allow / block / unable</text>

  <!-- L4 -->
  <rect x="280" y="466" width="340" height="62" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="280" y="466" width="4" height="62" rx="2" fill="#d97706"/>
  <text x="300" y="492" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="14.5" font-weight="600" fill="#0f172a">L4　人工</text>
  <text x="300" y="514" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="11.5" fill="#475569">宿主官方审批面板，不自研倒计时</text>

  <!-- spine arrows -->
  <line x1="450" y1="138" x2="450" y2="164" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="450" y1="254" x2="450" y2="280" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="458" y="272" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#4f46e5">AI</text>
  <line x1="450" y1="344" x2="450" y2="372" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="458" y="364" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#64748b">升级</text>
  <line x1="450" y1="436" x2="450" y2="464" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="458" y="456" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#64748b">unable</text>
  <line x1="450" y1="528" x2="450" y2="570" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 允许 rail -->
  <path d="M280,210 H120 V599 H353" fill="none" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrow-pass)"/>
  <path d="M280,313 H120" fill="none" stroke="#16a34a" stroke-width="1.6"/>
  <path d="M280,405 H120" fill="none" stroke="#16a34a" stroke-width="1.6"/>
  <path d="M280,497 H120" fill="none" stroke="#16a34a" stroke-width="1.6"/>
  <text x="200" y="203" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#16a34a">允许</text>
  <text x="200" y="306" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#16a34a">允许</text>
  <text x="200" y="398" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#16a34a">allow</text>
  <text x="200" y="490" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#16a34a">允许</text>

  <!-- 拒绝 rail -->
  <path d="M620,106 H735 V570" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrow-stop)"/>
  <path d="M620,210 H735" fill="none" stroke="#dc2626" stroke-width="1.6"/>
  <path d="M620,497 H735" fill="none" stroke="#dc2626" stroke-width="1.6"/>
  <path d="M620,405 H735" fill="none" stroke="#dc2626" stroke-width="1.6"/>
  <text x="690" y="398" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#dc2626">block</text>
  <text x="690" y="99" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" font-weight="600" fill="#dc2626">never</text>
  <text x="690" y="203" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#dc2626">拒绝</text>
  <text x="690" y="490" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="10.5" fill="#dc2626">拒绝</text>

  <!-- terminals -->
  <rect x="355" y="572" width="190" height="54" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="450" y="604" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="14" font-weight="600" fill="#15803d">执行</text>
  <rect x="650" y="572" width="170" height="54" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="735" y="604" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="14" font-weight="600" fill="#b91c1c">拒绝</text>

  <text x="655" y="672" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="12" fill="#64748b">四档强弱：允许 &lt; AI &lt; 人工 &lt; 拒绝</text>
  <line x1="450" y1="626" x2="450" y2="662" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- L5 -->
  <rect x="280" y="664" width="340" height="56" rx="10" fill="#ffffff" stroke="#a7f3d0"/>
  <rect x="280" y="664" width="4" height="56" rx="2" fill="#059669"/>
  <text x="300" y="688" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="14.5" font-weight="600" fill="#0f172a">L5　脱敏</text>
  <text x="300" y="708" font-family="'Segoe UI','Microsoft YaHei',system-ui,sans-serif" font-size="11.5" fill="#475569">结果侧命中即遮；明文只落本机映射表</text>
</svg>
